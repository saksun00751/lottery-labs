<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="#08080a"/>
  <!-- Gold accent ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#d4af37" stroke-width="6" opacity="0.35"/>
  <!-- LL lettermark -->
  <text
    x="256"
    y="348"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-weight="700"
    font-size="248"
    letter-spacing="-8"
    fill="url(#gold)"
  >LL</text>
  <!-- Gold gradient -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4dc8b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a15"/>
    </linearGradient>
  </defs>
</svg>
